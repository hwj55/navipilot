name: Build Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          build-tools: 35.0.0
          ndk: 25.1.8937393

      - name: Modify ProfilePage.kt to remove sponsor check
        run: |
          python3 -c "
          file_path = 'app/src/main/java/com/example/navipilot/ui/components/ProfilePage.kt'
          with open(file_path, 'r') as f:
              lines = f.readlines()

          result = []
          i = 0
          while i < len(lines):
              if '// 根据赞助金额确定用户类型' in lines[i]:
                  result.append('            val userType = 4\n')
                  i += 6
              else:
                  result.append(lines[i])
                  i += 1

          with open(file_path, 'w') as f:
              f.writelines(result)
          print('ProfilePage.kt modified successfully')
          "

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
