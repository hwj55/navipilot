
name: Build and Publish Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release 标签；留空则读取 app/build.gradle.kts 中的 versionName"
        required: false
        type: string

      release_name:
        description: "Release 标题；留空则使用 Navipilot + 标签"
        required: false
        type: string

      prerelease:
        description: "是否发布为预发行版本"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: navipilot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check signing secrets
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not configured"
              exit 1
            fi
          done

          if [ ! -f app/release.keystore ]; then
            echo "::error::app/release.keystore does not exist"
            exit 1
          fi

      - name: Create local.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

          # 以下密钥不是签名必需项，配置了就自动写入
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          AMAP_WEB_KEY: ${{ secrets.AMAP_WEB_KEY }}
          AMAP_WEB_SECRET: ${{ secrets.AMAP_WEB_SECRET }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"

            if [ -n "$GITHUB_CLIENT_ID" ]; then
              printf 'GITHUB_CLIENT_ID=%s\n' "$GITHUB_CLIENT_ID"
            fi

            if [ -n "$AMAP_WEB_KEY" ]; then
              printf 'AMAP_WEB_KEY=%s\n' "$AMAP_WEB_KEY"
            fi

            if [ -n "$AMAP_WEB_SECRET" ]; then
              printf 'AMAP_WEB_SECRET=%s\n' "$AMAP_WEB_SECRET"
            fi

            if [ -n "$MAPS_API_KEY" ]; then
              printf 'MAPS_API_KEY=%s\n' "$MAPS_API_KEY"
            fi
          } > local.properties

      - name: Resolve release metadata
        id: metadata
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          VERSION_NAME=$(sed -nE \
            's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
            app/build.gradle.kts | head -n 1)

          TAG_NAME="${INPUT_TAG_NAME:-$VERSION_NAME}"

          if [ -z "$TAG_NAME" ]; then
            echo "::error::Unable to determine the release tag"
            exit 1
          fi

          if [[ "$TAG_NAME" =~ [^A-Za-z0-9._-] ]]; then
            echo "::error::The release tag may only contain letters, numbers, dots, underscores and hyphens"
            exit 1
          fi

          RELEASE_NAME="${INPUT_RELEASE_NAME:-Navipilot $TAG_NAME}"

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

          echo "Release tag: $TAG_NAME"
          echo "Release name: $RELEASE_NAME"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Prepare release files
        id: files
        env:
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not found"
            exit 1
          fi

          mkdir -p release

          APK_NAME="Navipilot-$TAG_NAME.apk"

          cp "$APK_PATH" "release/$APK_NAME"

          (
            cd release
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          )

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

          ls -lh release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Navipilot-${{ steps.metadata.outputs.tag_name }}
          path: release/*
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.metadata.outputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Release $TAG_NAME already exists"
            exit 1
          fi

          args=(
            release create "$TAG_NAME"
            release/*
            --target "$GITHUB_SHA"
            --title "$RELEASE_NAME"
            --generate-notes
          )

          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

